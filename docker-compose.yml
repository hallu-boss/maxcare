
services:
  db:
    image: postgres:18
    container_name: maxcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: maxcare
      POSTGRES_USER: maxcare
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
