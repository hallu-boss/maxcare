# --- Common codes ---
VALIDATION_FAILED=The data did not pass validation.
MALFORMED_REQUEST=The request has an invalid format.
UNAUTHORIZED=Authentication is required.
ACCESS_TOKEN_EXPIRED=Your session has expired. Please refresh the token.
FORBIDDEN=You do not have permission to access this resource.
RESOURCE_NOT_FOUND=The resource was not found.
INTERNAL_ERROR=An unexpected server error occurred.

# --- Account and authentication ---
CAPTCHA_INVALID=reCAPTCHA verification failed.
EMAIL_ALREADY_EXISTS=This e-mail address is already registered.
AGE_RESTRICTION=Registration is available only to adults.
INVALID_CREDENTIALS=Invalid e-mail address or password.
ACCOUNT_NOT_ACTIVATED=The account has not been activated.
ACCOUNT_BLOCKED=The account has been blocked.
ACCOUNT_ALREADY_ACTIVE=The account is already active.
REFRESH_TOKEN_INVALID=The refresh token is invalid or has expired.
TOKEN_INVALID=The token is invalid.
TOKEN_EXPIRED=The token has expired.
TOKEN_ALREADY_USED=The token has already been used.

# --- Appointments, payments, receipts ---
SPECIALIZATION_NOT_FOUND=The specialization does not exist.
DOCTOR_NOT_FOUND=The doctor does not exist.
DOCTOR_SPECIALIZATION_MISMATCH=The doctor does not have the selected specialization.
DOCTOR_UNAVAILABLE=The doctor is unavailable and does not accept appointments.
OUTSIDE_WORKING_HOURS=The selected time is outside the doctor working hours.
SLOT_NOT_ALIGNED=The appointment start does not match the time slot grid.
SLOT_IN_PAST=An appointment cannot be booked in the past.
SLOT_UNAVAILABLE=The selected time slot is no longer available.
NO_ROOM_AVAILABLE=No room is available at the selected time.
PATIENT_OVERLAP=You already have an appointment at the same time.
APPOINTMENT_NOT_FOUND=The appointment does not exist.
CANCEL_TOO_LATE=An appointment can be cancelled no later than {0} hours before its start.
APPOINTMENT_NOT_CANCELLABLE=This appointment can no longer be cancelled.
APPOINTMENT_NOT_PAYABLE=This appointment is not awaiting payment.
PAYMENT_FAILED=The payment failed. Please try again.
PAYMENT_NOT_FOUND=The payment does not exist.
RECEIPT_NOT_AVAILABLE=The receipt is not available for this payment.

# --- Administration ---
DOCTOR_SPECIALIZATION_IN_USE=A specialization cannot be removed while the doctor has future active appointments in it.
WORKING_HOURS_INVALID=The working hours are invalid or overlap.
TIME_OFF_NOT_FOUND=The time-off entry does not exist.
ROOM_NOT_FOUND=The room does not exist.
ROOM_TYPE_NOT_FOUND=The room type does not exist.
ROOM_NUMBER_ALREADY_EXISTS=A room with this number already exists.
USER_NOT_FOUND=The user does not exist.
USER_ALREADY_BLOCKED=The account is already blocked.
USER_NOT_BLOCKED=The account is not blocked.
CANNOT_BLOCK_SELF=You cannot block your own account.
CANNOT_BLOCK_LAST_ADMIN=The last active administrator cannot be blocked.

# --- Field errors (Bean Validation and custom codes); arguments: {1}, {2} = constraint attributes sorted alphabetically ---
NotBlank=This field is required.
NotNull=This field is required.
NotEmpty=The list must not be empty.
Email=Invalid e-mail address.
Size=The length must be between {2} and {1} characters.
Past=The date must be in the past.
Pattern=Invalid value format.
Min=The value must be at least {1}.
Max=The value must not exceed {1}.
DateOfBirthTooOld=The provided date of birth is not valid.
